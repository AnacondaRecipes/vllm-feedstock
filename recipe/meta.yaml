{% set name = "vllm" %}
{% set version = "0.9.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/vllm-{{ version }}.tar.gz
  sha256: 6b0d855ea8ba18d76364c9b82ea94bfcaa9c9e724055438b5733e4716ed104e1
  patches:
    #- 0001-Search-for-the-CUDA-package-in-CMakeLists.patch
    - patches/0002-Remove-ninja-pip-requirement.patch
    - patches/0003-Manually-define-gettid.patch
    #- 0004-Factor-in-the-cmake-args-when-building-e.g.-for-cros.patch
    #- 0005-Configure-build-to-target-aarch64-even-though-CMake-.patch
    #- patches/0006-Use-PyTorch-2.7.1-to-keep-version-number-consistent-.patch
    # Some of the requirements need to be updated to work in the conda environment.
    # * remove intel-openmp python requirement. This will be handled through the conda environment: The
    #   conda intel-openmp package does not install itself in the python environment, so pip check for
    #   intel-openmp will fail if this python requirement is specified, even though the required files 
    #   are available in the conda environment.
    # * Use pytorch 2.7 for CPU builds. 2.6 packages aren't available on the main channel, and 2.7 is used
    #   for GPU builds already.
    - patches/0008-update-requirements.patch
  #  - fix-gettid.patch

build:
  skip: true  # [py<310 or py>312 or (osx and cpu_or_cuda=="cuda")]
  entry_points:
    - vllm = vllm.entrypoints.cli.main:main
  string: cpu_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [cpu_or_cuda == "cpu"]
  string: cuda_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [cpu_or_cuda == "cuda"]
  #script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  script_env:
    - VERBOSE=1
    - VLLM_TARGET_DEVICE={{ cpu_or_cuda }}
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}      # Ensures a C++ compiler is available
    - cmake
    - make
    - git
    # Needed for <numa.h> and linking -lnuma
    - libnuma # [linux]
    - libtorch>=2.7.0,<=2.8.0a0=*cpu* # [cpu_or_cuda=="cpu"]
    - libtorch>=2.7.0,<=2.8.0a0=*cuda* # [cpu_or_cuda=="cuda"]

  host:
    - python
    - cmake
    - ninja
    - packaging
    - setuptools >=77.0.3,<80.0.0
    - setuptools-scm
    - pytorch=2.7.0=*cpu* # [cpu_or_cuda=="cpu"]
    - pytorch=2.7.0=*cuda* # [cpu_or_cuda=="cuda"]
    - wheel
    - jinja2
    - pip
    # Ensures libnuma.so is available for linking
    - libnuma # [linux]
    - sleef
    - libtorch>=2.7.0,<=2.8.0a0=*cpu* # [cpu_or_cuda=="cpu"]
    - libtorch>=2.7.0,<=2.8.0a0=*cuda* # [cpu_or_cuda=="cuda"]

  run:

    - python
    - pyarrow =22.*
    # From common.txt
    - regex
    - cachetools
    - psutil
    - sentencepiece
    - numpy
    - requests >=2.26.0
    - tqdm
    - blake3
    - py-cpuinfo
    - transformers >=4.51.1
    # ???? huggingface-hub[hf_xet] >= 0.33.0  # Required for Xet downloads.
    - tokenizers >=0.21.1
    - protobuf
    # fastapi[standard] >= 0.115.0
    - fastapi >=0.115.0 
    - aiohttp
    - openai >=1.52.0,<=1.90.0
    - pydantic >=2.10
    - prometheus_client 
    - pillow
    - prometheus-fastapi-instrumentator >=7.0.0
    - tiktoken 
    - lm-format-enforcer >=0.10.11,<0.11
    - llguidance >=0.7.11,<0.8.0 # platform_machine == "x86_64" or platform_machine == "arm64" or platform_machine == "aarch64"
    - outlines ==0.1.11
    - lark ==1.2.2
    #- xgrammar #== 0.1.19 # platform_machine == "x86_64" or platform_machine == "aarch64" or platform_machine == "arm64"
    - typing_extensions >=4.10
    - filelock >=3.16.1 # need to contain https://github.com/tox-dev/filelock/pull/317
    - partial-json-parser
    - pyzmq >=25.0.0
    - msgspec
    - gguf >=0.13.0
    - mistral-common 
    #- opencv-python-headless >=4.11.0    # required for video IO
    - opencv >=4.11.0=*headless*
    - pyyaml
    - six >=1.16.0  # [py>311]
    - setuptools  >=77.0.3,<80.0.0
    - einops 
    - compressed-tensors
    - depyf ==0.18.0 # required for profiling and debugging with compilation config
    - cloudpickle
    - watchfiles
    - python-json-logger
    - scipy
    - ninja
    - pybase64

    ######################################################
    #- pyarrow >23

    # From cpu.txt:
    - numba ==0.61.2 #python version >3.9
    - pytorch=2.7.0=*cpu* # [cpu_or_cuda=="cpu"]
    - pytorch=2.7.0=*cuda* # [cpu_or_cuda=="cuda"]
    - libtorch>=2.7.0,<=2.8.0a0=*cpu* # [cpu_or_cuda=="cpu"]
    - libtorch>=2.7.0,<=2.8.0a0=*cuda* # [cpu_or_cuda=="cuda"]

    - torchaudio ==2.7.0
    - torchvision ==0.22.1
    - datasets >=4

    - intel-openmp # [x86_64]
    # From a search of the vllm code, it looks like python numa bindings are only
    # needed for testing.
    #- py-libnuma #!= "Darwin"
    - psutil #!= "Darwin"
    
    # from cuda.txt
    - llvm-openmp # [ cpu_or_cuda=="cuda"]
    - pytorch=2.7.0=*cuda* # [ cpu_or_cuda=="cuda"]
    
    # hidden dependencies not specified in requirements.txt
    - sleef


    
    
    #- ray 
    #- ray-serve #?
    #- ray-core # [cpu_or_cuda=="cuda"]
    - ray-core # [cpu_or_cuda=="cuda"]
    - xformers ==0.0.30  # [linux and cpu_or_cuda=="cuda"]

    # From pip check problems, TODO: check this with requirements files.

    #- triton
    #- xgrammar # need package (doubel check requirements file)
    
test:
  source_files:
    - tests/
  script_env:
    - VERBOSE=1
    - VLLM_TARGET_DEVICE={{ cpu_or_cuda }}
  imports:
    - vllm
    - pytest
  commands:
    #- pip list
    #- pip check
    - vllm --help
    - pytest tests/core/test_scheduler.py
  requires:
    - pytest
    - pytest-asyncio
    - pip
    #- ray

# Errors from pip check:
# vllm 0.9.2 requires datasets, which is not installed.
# vllm 0.9.2 requires depyf, which is not installed.
# vllm 0.9.2 requires intel-extension-for-pytorch, which is not installed.
# vllm 0.9.2 requires intel-openmp, which is not installed.
# vllm 0.9.2 requires llguidance, which is not installed.
# vllm 0.9.2 requires opencv-python-headless, which is not installed.
# vllm 0.9.2 requires py-libnuma, which is not installed.
# vllm 0.9.2 requires pybase64, which is not installed.
# vllm 0.9.2 requires torchaudio, which is not installed.
# vllm 0.9.2 requires torchvision, which is not installed.
# vllm 0.9.2 requires triton, which is not installed.
# vllm 0.9.2 requires xgrammar, which is not installed.
# vllm 0.9.2 has requirement numba==0.61.2; python_version > "3.9", but you have numba 0.63.1.
# vllm 0.9.2 has requirement openai<=1.90.0,>=1.52.0, but you have openai 2.14.0.
# vllm 0.9.2 has requirement setuptools<80.0.0,>=77.0.3, but you have setuptools 80.9.0.
# vllm 0.9.2 has requirement transformers>=4.51.1, but you have transformers 2.1.1.

about:
  summary: A high-throughput and memory-efficient inference and serving engine for LLMs
  license: Apache-2.0
  license_file:
    - LICENSE
    - csrc/quantization/marlin/sparse/LICENSE
    - csrc/quantization/marlin/dense/LICENSE

extra:
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/49522
    reason: Client request
    recipe-maintainers:
      - ianaobi
      - bkreider
