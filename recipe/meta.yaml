{% set name = "vllm" %}
{% set version = "0.32.0" %}
{% set build_num = 0 %}

{% if gpu_variant =="cuda" %}
{% set build_num = 200 + build_num %}
{% endif %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/vllm-{{ version }}.tar.gz
    sha256: d2c957d5eee3d0985012151315ddc62cbe0cd368fc96a5fc3510438d9dddf2ad
    patches:
      - patches/0001-Search-for-the-CUDA-package-in-CMakeLists.patch
      - patches/0002-Remove-ninja-pip-requirement.patch
      - patches/0003-Manually-define-gettid.patch
      - patches/0004-Allow-skipping-ACL-via-VLLM_SKIP_ACL-env-var.patch
      - patches/0005-Guard-against-missing-flashinfer.patch
      - patches/0006-Relax-mcp-requirement-to-allow-mcp-1.x.patch
      - patches/0007-Import-mcp-ClientSession-from-the-top-level-mcp-pack.patch
      - patches/0008-updating-requirements.patch
      - patches/0009-Remove-extra-args-from-CPU-compute-slot-mapping-kernel.patch
      
  # cmake/external_projects/vllm_flash_attn.cmake
  - url: https://github.com/vllm-project/flash-attention/archive/9cd61de38763d712bb6ce56e2a02cc2bf718c89f.tar.gz
    sha256: b0dcc13a7e4d5ed4bf69f092d7eb50c1b80de76a4e33315a722c893f9488ab9d
    folder: flash-attention
  # cutlass is a git submodule of flash-attention (not included in GitHub tarballs)
  - url: https://github.com/NVIDIA/cutlass/archive/62750a2b75c802660e4894434dc55e839f322277.tar.gz
    sha256: 78816d6c6d97793b5b59ef2a702174cb85b78dfcefc8fe2489964de2e42f17d2
    folder: flash-attention/csrc/cutlass
  # vLLM's CMakeLists.txt (CUTLASS_REVISION) pins v4.7.1. It needs the full source tree
  # (python/ for Machete generation, examples/ for CUTLASS MLA), so the conda cutlass
  # package can't be used.
  - url: https://github.com/NVIDIA/cutlass/archive/refs/tags/v4.7.1.tar.gz
    sha256: 8290eb914cd5aaf4c665ee4108ba5bd65383cfee1296286a42a7ef711554d365
    folder: cutlass-src

  # Sources below are normally git-fetched by vLLM's cmake/external_projects/*.cmake
  # at build time. They are staged here as checksummed sources and handed to cmake
  # through the *_SRC_DIR environment variables set in build.sh.
  # Revisions match vllm v{{ version }}; re-check on every version bump.
  # GitHub tarballs omit git submodules, so those are staged separately at the
  # commit each parent repo pins.

  # cmake/external_projects/deepgemm.cmake
  - url: https://github.com/vllm-project/DeepGEMM/archive/1e1842a833699298f7afc02eefb2ed168fff6938.tar.gz
    sha256: bded2f76d129e403142e15c80175871c53c39478229a7ee01474623cabd1d965
    folder: deepgemm-src
  - url: https://github.com/NVIDIA/cutlass/archive/f3fde58372d33e9a5650ba7b80fc48b3b49d40c8.tar.gz
    sha256: 2e5890306557bd87136e1d6914e4ee42536050b9116433848175520fd15991f2
    folder: deepgemm-src/third-party/cutlass
  # deep_jit is a git submodule of DeepGEMM (deepgemm.cmake: GIT_SUBMODULES "third-party/cutlass" "third-party/deep_jit").
  # It replaced the fmt submodule that DeepGEMM used at the vLLM v0.26.0 pin.
  - url: https://github.com/deepseek-ai/DeepJIT/archive/3732a3b9a0a2e5126396908a362ba5abdf043b2f.tar.gz
    sha256: 436ebe903967adbebd6f60697b3ac36b991727d667c845cd83376f62138fe41e
    folder: deepgemm-src/third-party/deep_jit

  # cmake/external_projects/flashmla.cmake
  - url: https://github.com/vllm-project/FlashMLA/archive/0eee43b12f034b657133cf2afca6a72ebb6efccf.tar.gz
    sha256: b5f44e67b555d9a1603338e0a1631850fb368d5f826c0cc76d86f7af90a09b3e
    folder: flashmla-src
  - url: https://github.com/NVIDIA/cutlass/archive/147f5673d0c1c3dcf66f78d677fd647e4a020219.tar.gz
    sha256: 9f6c53320a85b4a570975e557918cde65168cd311f081920446c238437347dc6
    folder: flashmla-src/csrc/cutlass

  # cmake/external_projects/qutlass.cmake
  # Its own cutlass submodule is not staged: vLLM passes CUTLASS_INCLUDE_DIR (from
  # cutlass-src above), and qutlass only falls back to the submodule without it.
  - url: https://github.com/IST-DASLab/qutlass/archive/e74319e3405ce6d71965732880f5dc1f52371f64.tar.gz
    sha256: 39dda9c3626e024f00cd0afbe54971edce79fa12f0842d79022c8e23303faea3
    folder: qutlass-src

  # cmake/external_projects/fmha_sm100.cmake (vllm-project/MSA)
  - url: https://github.com/vllm-project/MSA/archive/968061ab16cb14991a5c7d4c0e8eabf531be0dcf.tar.gz
    sha256: 13bd3949621aece2ed49aa59028190ef15fa989ecaac641e148ed5574796dc21
    folder: msa-src
  - url: https://github.com/NVIDIA/cutlass/archive/098de2a652cf8f00fd70b2df54051c7eccbb855a.tar.gz
    sha256: a8a1b952c7f6179bc8076f20d45859f18bd81f21f3d22b6766d7f3f0cceb5d54
    folder: msa-src/python/fmha_sm100/cutlass

  # cmake/external_projects/tml_fa4.cmake
  - url: https://github.com/vllm-project/tml-fa4/archive/75765e76a9c2c012c1f6ecd64577eb646eb4d303.tar.gz
    sha256: efa621ccf26407e686e5bac07476350aa1f2f3aaa175a4975b97455aeba6ffca
    folder: tml-fa4-src

  # oneDNN is fetched at build time by the CPU build and statically linked into the _C*.so extensions.
  # Version info: cmake/cpu_extension.cmake in the vllm source, in the "Build oneDNN for GEMM kernels"
  # block (search for "oneDNN" / FetchContent_Declare):
  #   x86-64:  GIT_TAG v3.13
  #   aarch64: GIT_TAG 9c5be1cc59e368aebf0909e6cf20f981ea61462a  (pinned commit; ACL is skipped via VLLM_SKIP_ACL)
  # build.sh points cmake at the staged copy with FETCHCONTENT_SOURCE_DIR_ONEDNN. Re-check on every version bump.
  - url: https://github.com/oneapi-src/oneDNN/archive/refs/tags/v3.13.tar.gz  # [x86_64 and gpu_variant=="cpu"]
    sha256: f90a34cc3f1a5af511570d72f4437205efdf97e1d28c576418daa7ef1a34daaa  # [x86_64 and gpu_variant=="cpu"]
    folder: onednn-src  # [x86_64 and gpu_variant=="cpu"]
  - url: https://github.com/oneapi-src/oneDNN/archive/9c5be1cc59e368aebf0909e6cf20f981ea61462a.tar.gz  # [aarch64 and gpu_variant=="cpu"]
    sha256: b15611c536b32c119b5acc600b69f5971ff3276badaf434c2790c1f59585bf98  # [aarch64 and gpu_variant=="cpu"]
    folder: onednn-src  # [aarch64 and gpu_variant=="cpu"]

  # cmake/external_projects/triton_kernels.cmake (DEFAULT_TRITON_KERNELS_TAG)
  - url: https://github.com/triton-lang/triton/archive/refs/tags/v3.5.1.tar.gz
    sha256: 03d7c41f6f2dc1dfa3445776c4a893dc34b1e0ece42b953f036c071ff6409b80
    folder: triton-src

  # cmake/external_projects/deepselect.cmake
  - url: https://github.com/vllm-project/DeepSelect/archive/d96d33afe1fab0d6066da49cdc91e64c2bee65ea.tar.gz
    sha256: 88b9c40522bc361417c77e22447b406dffef27e1230f495279a30734c05ef6a4
    folder: deepselect-src
  - url: https://github.com/NVIDIA/cutlass/archive/ae6bccf341fb4410241f696ba06873023d5ce4ed.tar.gz
    sha256: 02249181f05f09f174545a9a722df23a5d0d59e458a99c06257e4172adbe01ad
    folder: deepselect-src/csrc/3rdparty/cutlass

  # cmake/external_projects/flashkda.cmake
  - url: https://github.com/vllm-project/FlashKDA/archive/17a037d98da546deb4591e967cf961a43c034d8b.tar.gz
    sha256: 0dffba6f8bfc0724d46276d606c1322813d4cd63584de7f14ddb63317973fd3c
    folder: flashkda-src
  - url: https://github.com/NVIDIA/cutlass/archive/5c149f52a436782210263fb2f19b354443a61c6a.tar.gz
    sha256: fbf35b9d16a3c2c7384a4a044a5407d1dea334d74b3152357c1fa246bc07c6dc
    folder: flashkda-src/cutlass

build:
  # does not support windows, and only supports CUDA on x86-64
  # Does not currently support osx due to xgrammar dependency.
  # Skipping CUDA 3.14 builds due to lack of support from vendored FlashAttention version
  skip: true  # [py<311 or py>314 or (gpu_variant=="cuda" and py>=314) or ((osx or aarch64) and gpu_variant=="cuda") or win or osx]
  entry_points:
    - vllm = vllm.entrypoints.cli.main:main
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cpu"]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cuda"]
  script_env:
    - VERBOSE=1
    - VLLM_TARGET_DEVICE={{ gpu_variant }}
    - VLLM_SKIP_ACL=1 # [aarch64]
  number: {{ build_num }}
  missing_dso_whitelist: # [gpu_variant =="cuda"]
    # libcuda.so is the cuda driver API library and is a system library.
    - "**/libcuda.so*"            # [gpu_variant =="cuda"]

requirements:
  build:
    - {{ compiler('c') }}        # oneDNN (statically linked into the CPU build) compiles C sources (ittnotify)
    - {{ compiler('cxx') }}      # Ensures a C++ compiler is available
    - {{ stdlib('c') }}
    - {{ compiler('cuda') }}     # [gpu_variant=="cuda"]
    - cmake >=3.26.1
    - ninja-base
    - git

  host:
    - python
    - packaging >=24.2
    - setuptools >=78.1.1,<81.0.0
    - setuptools-scm >=8
    - setuptools-rust >=1.9.0
    - pytorch {{ pytorch }}=*cpu* # [gpu_variant=="cpu"]
    - pytorch {{ pytorch }}=*cuda* # [gpu_variant=="cuda"]
    - wheel
    - jinja2 >=3.1.6
    - pip
    # Ensures libnuma.so is available for linking
    - libnuma {{ libnuma }} # [linux and gpu_variant=="cpu"]
    - sleef {{ sleef }}
    - libtorch ={{ libtorch }}=*cpu*openblas* # [gpu_variant=="cpu"]
    - libtorch ={{ libtorch }}=*cuda* # [gpu_variant=="cuda"]
    - regex
    # CUDA development headers and libraries (linking only; runtime comes via pytorch).
    - cuda-version {{ cuda_compiler_version }}   # [gpu_variant == "cuda"]
    - cuda-driver-dev                              # [gpu_variant == "cuda"]
    - cuda-cudart-dev                              # [gpu_variant == "cuda"]
    - cuda-nvrtc-dev                               # [gpu_variant == "cuda"]
    - cuda-nvtx-dev                                # [gpu_variant == "cuda"]
    - cuda-nvml-dev                                # [gpu_variant == "cuda"]
    - libcublas-dev                                # [gpu_variant == "cuda"]
    - libcufft-dev                                 # [gpu_variant == "cuda"]
    - libcurand-dev                                # [gpu_variant == "cuda"]
    - libcusolver-dev                              # [gpu_variant == "cuda"]
    - libcusparse-dev                              # [gpu_variant == "cuda"]

    # for sys_mem_monitor.py:
    - psutil
    - pyyaml
    - matplotlib
    - pandas

  run:

    - python
    # From common.txt
    - regex
    - cachetools
    - psutil
    - sentencepiece
    - numpy
    - requests >=2.33.0
    - tqdm
    - blake3
    - py-cpuinfo
    - transformers >=5.16.1,<5.20.0
    - huggingface_hub >=1.31.0
    - tokenizers >=0.23.2
    - safetensors >=0.6.2
    # upstream requirement is protobuf >=5.29.6, witch a bunch of specific versions excluded, all of
    # which are below 6.33.5.
    - protobuf >=6.33.5
    - fastapi >=0.133.0,<0.137.0
    - starlette >=1.0.1
    - aiohttp >=3.14.3
    - openai >=2.25.0
    - pydantic >=2.12.0
    - prometheus_client >=0.18.0
    - pillow >=12.3.0
    - prometheus-fastapi-instrumentator >=8.0.0
    - tiktoken >=0.6.0
    - lm-format-enforcer ==0.11.3
    - llguidance >=1.7.0,<1.8.0
    - outlines-core ==0.2.14
    - lark ==1.2.2
    - xgrammar ==0.2.8
    - jsonschema >=4.23.0
    - typing_extensions >=4.10
    - filelock >=3.20.3 # need to contain https://github.com/tox-dev/filelock/pull/317
    - partial-json-parser
    - pyzmq >=25.0.0
    - msgspec
    - mistral-common >=1.11.6
    - opencv >=4.13.0=*headless*  # required for video IO
    - pyyaml
    - six >=1.16.0  # [py>311]
    - setuptools >=78.1.1,<81.0.0 # [py>311 or gpu_variant=="cpu"]
    - einops 
    - compressed-tensors ==0.17.0
    - depyf ==0.20.0 # required for profiling and debugging with compilation config
    - cloudpickle
    - watchfiles
    - python-json-logger
    - pybase64
    
    - cbor2
    - ijson
    - setproctitle
    - oss-harmony >=0.0.11
    - anthropic >=0.71.0
    - model-hosting-container-standards >=0.1.14,<1.0.0
    - mcp >=1.9.4,<3.0.0
    - opentelemetry-sdk >=1.27.0
    - opentelemetry-api >=1.27.0
    - opentelemetry-exporter-otlp >=1.27.0
    - opentelemetry-semantic-conventions-ai >=0.4.1

    # From cpu.txt:
    - numba ==0.65.0
    - packaging >=24.2
    - pytorch {{ pytorch }}=*cpu* # [gpu_variant=="cpu"]
    - pytorch {{ pytorch }}=*cuda* # [gpu_variant=="cuda"]
    - libtorch {{ libtorch }}=*cpu*openblas* # [gpu_variant=="cpu"]
    - libtorch {{ libtorch }}=*cuda* # [gpu_variant=="cuda"]

    - torchaudio ==2.11.0=*cpu* # [gpu_variant=="cpu"]
    - torchaudio ==2.11.0=*cuda* # [gpu_variant=="cuda"]
    - torchvision ==0.28=*cpu* # [gpu_variant=="cpu"]
    - torchvision ==0.28=*cuda* # [gpu_variant=="cuda"]
    - torchcodec >=0.14.0

    # The intel-openmp version pin differs from the cpu.txt requirements file for these reasons:
    # * There have been some deprecations, in particular the Intel fortran compiler, but this does not appear to affect vLLM
    # * There is a possible API deprecation and/or removal of some of the functions, but vLLM does not appear to use them, as they
    #   would cause build failures
    # * conda does not currently have a 2024.2.1 build (the version pinned in cpu.txt), and building one just for vLLM could have
    #   other repurcussions as the feedstock is multi-output and the additional outputs might not be things we want to support
    #   (in particular, MKL).
    - intel-openmp ==2025.0.0 # [x86_64 and gpu_variant=="cpu"]

    # from cuda.txt
    - __cuda   # [gpu_variant == "cuda"]
    - cuda-version =={{ cuda_compiler_version }}   # [gpu_variant == "cuda"]
    - llvm-openmp # [ gpu_variant=="cuda"]
    # pytorch is in cuda.txt and cpu.txt
    

    # Note from Charles about ray: https://anaconda.slack.com/archives/C08940LAV4Y/p1775579243337879?thread_ts=1775484005.040459&cid=C08940LAV4Y
    - ray-core # [gpu_variant=="cuda"]
    - ray-adag # [gpu_variant=="cuda"]
    - cupy # [gpu_variant=="cuda"]
    - fastsafetensors >=0.3.3 # [gpu_variant=="cuda"]
    - nvtx ==0.2.15 # [gpu_variant=="cuda"]
    - apache-tvm-ffi ==0.1.11 # [gpu_variant=="cuda"]
    - tilelang ==0.1.12 # [gpu_variant=="cuda"]
    - python-cudnn-frontend >=1.19.1 # [gpu_variant=="cuda"]
    
    

    # Tokenspeed-mla is not needed for every use case. It is an optimization
    # for MLA workloads, which already have fallbacks.
    #- tokenspeed-mla ==0.2.15 # [gpu_variant=="cuda"]
    # Humming kernels is not strictly required for vLLM, despite being in the cuda.txt
    # requirements. vLLM will work without it, and there are checks to make sure the
    # library is present before using the features that require it.
    #- humming-kernels[cu13] ==0.1.17 # [gpu_variant=="cuda"] # TODO: Make sure this is correct for [cu13]
    # pynvvideocodec is optional, and must be explicitly selected by a user (if available) in order to use it.
    # There are fallbacks (torchcodec/opencv)
    #- pynvvideocodec Optional depenency
    #- flashinfer-python Optional dependency
    #- flashinfer-cubin Optional dependency
    # 
    # nvidia-cutlass-dsl is an optional dependency with fallback paths if it isn't present,
    # despite it being listed in the cuda.txt requirements file.
    #- nvidia-cutlass-dsl[cu13] Optional Dependency

    # quack-kernels is an optional dependency only used with FlashAttention4 and
    # CuteDSL.
    #- quack-kernels Optional Dependency

  # The optional dependencies from above are run constraints here
  run_constrained:
    - tokenspeed-mla ==0.2.15    # [gpu_variant=="cuda"]
    - humming-kernels ==0.1.17   # [gpu_variant=="cuda"]
    - pynvvideocodec ==2.0.4     # [gpu_variant=="cuda"]
    - flashinfer-python ==0.7.0.post1 # [gpu_variant=="cuda"]
    - flashinfer-cubin ==0.7.0.post1  # [gpu_variant=="cuda"]
    - nvidia-cutlass-dsl ==4.8.0 # [gpu_variant=="cuda"]
    - quack-kernels  >=0.6.5     # [gpu_variant=="cuda"]

    # instanttensor is in requirements/cuda.txt, but it appears to be optional.
    - instanttensor >=0.2.2 # [gpu_variant=="cuda"]

    # Additional run_constrained from setup.py
    # FIXME: Verify the below packages are still in setup.py; verify the versions
    - tensorizer ==2.10.1
    - fastsafetensors >=0.3.2
    - instanttensor >=0.1.9
    - runai-model-streamer >=0.15.7
    - smg-grpc-servicer >=0.5.2
    - vllm-gguf-plugin >=0.0.2
    

    # We don't currently have this package on main, but it is listed as an extra dependency in setup.py
    # If we ever add the package to main, it will probably have a different package name due to
    # the '-cu13' suffix. However, the -cu13 suffix listed here means that it will probably not have a name
    # conflict with anything on main, and not cause any problems. All that this likely gives us is 
    # a documented note that we see that this constraint might exist in the future. 
    - nvidia-deepstream-videodecode-cu13 >=9.0.2 # [linux and x86_64 and gpu_variant=="cuda"]

    - opentelemetry-sdk >=1.26.0
    - opentelemetry-api >=1.26.0
    - opentelemetry-exporter-otlp >=1.26.0
    - opentelemetry-semantic-conventions-ai >=0.4.1



test:
  source_files:
    - tests/
  files:
    - cpu-tests_linux-64.sh # [(linux and x86_64) and gpu_variant=="cpu"]
    - cpu-tests_linux-aarch64.sh # [(linux and aarch64) and gpu_variant=="cpu"]
    - cuda-tests_linux-64.sh # [(linux and x86_64) and gpu_variant=="cuda"]
  script_env:
    - VERBOSE=1
    - VLLM_TARGET_DEVICE={{ gpu_variant }}
  imports:
    - vllm
    - pip
    # Touch the code paths that the mcp patches (0006, 0007) modify
    - vllm.entrypoints.mcp.tool_server
    - vllm.entrypoints.openai.responses.context

  commands:
    - pip list
    - pip check
    - vllm --help
    - chmod +x cpu-tests_linux-64.sh # [(linux and x86_64) and gpu_variant=="cpu"]
    - ./cpu-tests_linux-64.sh # [(linux and x86_64) and gpu_variant=="cpu"]
    - chmod +x cuda-tests_linux-64.sh # [(linux and x86_64) and gpu_variant=="cuda"]
    - ./cuda-tests_linux-64.sh # [(linux and x86_64) and gpu_variant=="cuda"]
    - chmod +x cpu-tests_linux-aarch64.sh # [(linux and aarch64) and gpu_variant=="cpu"]
    - ./cpu-tests_linux-aarch64.sh # [(linux and aarch64) and gpu_variant=="cpu"]

  requires:
    - pytest
    - pytest-asyncio
    - pip
    - tblib
    - accelerate
    - sentence-transformers
    # 'av' needed for some tests. Version from requirements/tests/cuda.txt
    - av ==16.1.0 # [py>=311]
    - {{ compiler('cxx') }}   # [linux] Required by torch.compile (inductor) at runtime
    - modelscope

about:
  home: https://vllm.ai/
  summary: A high-throughput and memory-efficient inference and serving engine for LLMs
  description: |
    vLLM is a fast and easy-to-use library for LLM inference and serving. 
  # This package vendors several projects that result in the following license string
  # and license_family.
  license: Apache-2.0 AND BSD-3-Clause AND MIT
  license_file:
    - LICENSE
    # vllm/third_party/flash_linear_attention is bundled in the sdist and installed (MIT)
    - vllm/third_party/flash_linear_attention/LICENSE
    - flash-attention/LICENSE
    - flash-attention/csrc/cutlass/LICENSE.txt
    - cutlass-src/LICENSE.txt
    - deepgemm-src/LICENSE
    - deepgemm-src/third-party/cutlass/LICENSE.txt
    - deepgemm-src/third-party/deep_jit/LICENSE
    - flashmla-src/LICENSE
    - flashmla-src/csrc/cutlass/LICENSE.txt
    - qutlass-src/LICENSE
    - msa-src/LICENSE
    - msa-src/NOTICE
    - msa-src/python/fmha_sm100/cutlass/LICENSE.txt
    - tml-fa4-src/LICENSE
    - triton-src/LICENSE
    - deepselect-src/LICENSE
    - deepselect-src/csrc/3rdparty/cutlass/LICENSE.txt
    - flashkda-src/LICENSE
    - flashkda-src/cutlass/LICENSE.txt
    # oneDNN is statically linked into the CPU extensions. THIRD-PARTY-PROGRAMS carries the notices
    # for its bundled xbyak (BSD-3-Clause), ittnotify (GPL-2.0-only OR BSD-3-Clause, used as BSD-3-Clause), spdlog (MIT), etc.
    - onednn-src/LICENSE  # [gpu_variant=="cpu"]
    - onednn-src/THIRD-PARTY-PROGRAMS  # [gpu_variant=="cpu"]
  license_family: Other
  doc_url: https://docs.vllm.ai/en/latest/usage/
  dev_url: https://github.com/vllm-project/vllm

extra:
    recipe-maintainers:
      - ianaobi
      - bkreider
      - shermansiu
