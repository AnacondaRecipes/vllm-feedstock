{% set name = "vllm" %}
{% set version = "0.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/vllm-{{ version }}.tar.gz
  sha256: 03d641f10d0181b630243c096484da0b5fdf608befe026af831ab87a51c09ab1
  #patches:
  #  - fix-gettid.patch

build:
  skip: true  # [py<39 or not py==310]
  entry_points:
    - vllm = vllm.entrypoints.cli.main:main
  #script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}      # Ensures a C++ compiler is available
    - cmake
    - make
    - git
    - libnuma                  # Needed for <numa.h> and linking -lnuma
    - libtorch=*=*cpu*

  host:
    - python
    - cmake
    - ninja
    - packaging
    - setuptools
    - setuptools-scm
    - pytorch=*=*cpu*
    - wheel
    - jinja2
    - pip
    - libnuma                  # Ensures libnuma.so is available for linking
    - sleef
    - libtorch=*=*cpu*  
    #- libtorch

  run:
    - llvm-openmp
    - python
    - cachetools
    - psutil
    - sentencepiece
    - numpy 
    - requests 
    - tqdm
    
    - py-cpuinfo
    - transformers
    - tokenizers 
    - protobuf
    - fastapi 
    - aiohttp
    - openai 
    - pydantic 
    - prometheus_client 
    - pillow
    
    - tiktoken 
    
    - lark 
      #- xgrammar
    - typing_extensions
    - filelock 
    
    - pyzmq
    - msgspec
    - gguf
    - importlib-metadata
    
    - pyyaml
    - six   # [py>311]
    - setuptools   # [py>311]
    
    
    #- depyf 
    - cloudpickle
    - watchfiles
    - python-json-logger
    - scipy
    - ninja
    - numba 
    
    - pytorch=*=*cpu* # [ cpu_or_cuda=="cpu"]
    #- libtorch=*=*cpu*
    - libtorch
    - torchaudio 
    - torchvision 
    - libnuma
    - sleef
    - lm-format-enforcer 
    - outlines 
    - prometheus-fastapi-instrumentator 
    - einops
    - blake3
    - partial-json-parser
    - mistral-common 
    - compressed-tensors
    - ray 
    #- ray-serve #?
    #- ray-core #?
    - xformers ==0.0.29.post1  # [linux and cpu_or_cuda=="cuda"]
test:
  imports:
    - vllm
  commands:
    - pip check
    - vllm --help
  requires:
    - pip

about:
  summary: A high-throughput and memory-efficient inference and serving engine for LLMs
  license: Apache-2.0
  license_file:
    - LICENSE
    - csrc/quantization/marlin/sparse/LICENSE
    - csrc/quantization/marlin/dense/LICENSE

extra:
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/49522
    reason: Client request
    recipe-maintainers:
      - ianaobi
      - bkreider
